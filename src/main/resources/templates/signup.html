<!DOCTYPE html>
<html>
<head><title>Sign Up</title></head>
<body style="font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px;">
<form action="/register" method="post" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
    <h2>Create Account</h2>
    <input type="text" name="username" placeholder="Username" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit" style="background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer;">Sign Up</button>
</form>
</body>
</html>
